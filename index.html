<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛍️super MIX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Navegación -->
  <nav class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold"><i class="fa-solid font-bold fa-store mr-2"></i>super MIX POS</h1>
    <div class="space-x-4">
      <button onclick="switchTab('pos')" class="px-3 py-1 bg-blue-700 hover:bg-blue-800 rounded font-semibold"><i class="fa-solid fa-cart-shopping mr-1"></i> Venta</button>
      <button onclick="switchTab('creditos')" class="px-3 py-1 bg-blue-700 hover:bg-blue-800 rounded font-semibold"><i class="fa-solid fa-hand-holding-dollar mr-1"></i> Créditos</button>
      <button onclick="switchTab('inventario')" class="px-3 py-1 bg-blue-700 hover:bg-blue-800 rounded font-semibold"><i class="fa-solid fa-boxes-stacked mr-1"></i> Inventario</button>
    </div>
  </nav>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="p-6 max-w-7xl mx-auto">

    <!-- SECCIÓN POS / VENTA -->
    <section id="sec-pos" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Catálogo / Búsqueda de Productos -->
      <div class="md:col-span-2 bg-white p-4 rounded-lg shadow">
        <h2 class="text-lg font-bold mb-3 text-gray-700">Productos</h2>
        <input type="text" id="pos-search-prod" onkeyup="filterProducts()" placeholder="Buscar producto por nombre o código..." class="w-full p-2 border border-gray-300 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
        
        <div id="grid-productos" class="grid grid-cols-2 sm:grid-cols-3 gap-4 max-h-[500px] overflow-y-auto">
          <!-- Se carga dinámicamente -->
        </div>
      </div>

      <!-- Carrito de Compras -->
      <div class="bg-white p-4 rounded-lg shadow flex flex-col justify-between">
        <div>
          <h2 class="text-lg font-bold mb-3 text-gray-700 border-b pb-2">Carrito de Compra</h2>
          
          <!-- BUSCADOR DE CLIENTES EN EL CARRITO -->
          <div class="mb-4 relative">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Cliente:</label>
            <input type="text" id="search-cliente" onkeyup="searchCliente()" placeholder="Buscar cliente por nombre o CI..." class="w-full p-2 text-sm border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <div id="cliente-results" class="hidden absolute left-0 right-0 bg-white border border-gray-300 rounded shadow-lg max-h-40 overflow-y-auto z-10 text-sm"></div>
            <p id="cliente-seleccionado" class="text-xs text-blue-600 font-bold mt-1">Cliente actual: Consumidor Final</p>
          </div>

          <!-- Ítems del Carrito -->
          <div id="carrito-items" class="space-y-2 max-h-[250px] overflow-y-auto pr-1">
            <p class="text-xs text-gray-400 text-center py-4">El carrito está vacío</p>
          </div>
        </div>

        <!-- Total y Tipo de Pago -->
        <div class="border-t pt-4 mt-4">
          <div class="flex justify-between text-xl font-bold mb-4">
            <span>Total:</span>
            <span id="cart-total" class="text-blue-600">$0.00</span>
          </div>

          <label class="block text-xs font-semibold text-gray-600 mb-1">Método de Pago:</label>
          <select id="metodo-pago" onchange="togglePagoCredito()" class="w-full p-2 text-sm border border-gray-300 rounded mb-3">
            <option value="contado">Efectivo / Contado</option>
            <option value="credito">Venta a Crédito</option>
          </select>

          <!-- Input Pago Inicial si es Crédito -->
          <div id="box-pago-inicial" class="hidden mb-3">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Abono / Pago Inicial:</label>
            <input type="number" id="pago-inicial" value="0" min="0" class="w-full p-2 text-sm border border-gray-300 rounded">
          </div>

          <button onclick="procesarVenta()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded transition-colors">
            Completar Venta
          </button>
        </div>
      </div>
    </section>

    <!-- SECCIÓN CRÉDITOS Y ABONOS -->
    <section id="sec-creditos" class="hidden bg-white p-6 rounded-lg shadow">
      <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2"><i class="fa-solid fa-wallet mr-2"></i>Cuentas por Cobrar (Créditos)</h2>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-sm border-b">
              <th class="p-3">Cliente</th>
              <th class="p-3">Total Venta</th>
              <th class="p-3">Saldo Pendiente</th>
              <th class="p-3">Estado</th>
              <th class="p-3 text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-creditos" class="text-sm divide-y">
            <!-- Se genera dinámicamente -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- SECCIÓN INVENTARIO -->
    <section id="sec-inventario" class="hidden bg-white p-6 rounded-lg shadow">
      <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">Gestión de Inventario</h2>
      <p class="text-sm text-gray-500">Módulo de inventario base habilitado.</p>
    </section>

  </div>

  <!-- MODAL PARA REGISTRAR ABONO -->
  <div id="modal-abono" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-xl">
      <h3 class="text-lg font-bold text-gray-800 mb-2">Registrar Abono</h3>
      <p id="abono-cliente-nombre" class="text-sm text-gray-600 mb-1"></p>
      <p id="abono-saldo-actual" class="text-sm font-semibold text-red-600 mb-4"></p>
      
      <label class="block text-xs font-semibold text-gray-600 mb-1">Monto del Abono ($):</label>
      <input type="number" id="monto-abono" min="1" class="w-full p-2 border border-gray-300 rounded mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
      
      <div class="flex justify-end space-x-2">
        <button onclick="closeModalAbono()" class="px-4 py-2 bg-gray-300 hover:bg-gray-400 rounded text-sm font-semibold">Cancelar</button>
        <button onclick="confirmarAbono()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-semibold">Guardar Abono</button>
      </div>
    </div>
  </div>

  <script>
    // --- DATOS DE EJEMPLO / ESTADO INICIAL ---
    let productos = [
      { id: 1, nombre: "Arroz 1kg", precio: 2.50, stock: 40 },
      { id: 2, nombre: "Aceite 1L", precio: 4.80, stock: 25 },
      { id: 3, nombre: "Leche 1L", precio: 1.20, stock: 50 },
      { id: 4, nombre: "Pan Molde", precio: 2.00, stock: 15 }
    ];

    let clientes = [
      { id: 1, nombre: "Consumidor Final", ci: "0000000000" },
      { id: 2, nombre: "Carlos Mendoza", ci: "1723456789" },
      { id: 3, nombre: "María López", ci: "0987654321" },
      { id: 4, nombre: "Juan Pérez", ci: "1102938475" }
    ];

    let carrito = [];
    let clienteSeleccionado = clientes[0];
    let cuentasPorCobrar = [];
    let creditoIndexSeleccionado = null;

    // --- NAVEGACIÓN ---
    function switchTab(tab) {
      document.getElementById('sec-pos').classList.add('hidden');
      document.getElementById('sec-creditos').classList.add('hidden');
      document.getElementById('sec-inventario').classList.add('hidden');
      
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      if (tab === 'creditos') renderCreditos();
    }

    // --- RENDERIZAR PRODUCTOS ---
    function renderProductos(list = productos) {
      const grid = document.getElementById('grid-productos');
      grid.innerHTML = '';
      list.forEach(p => {
        grid.innerHTML += `
          <div class="border rounded-lg p-3 flex flex-col justify-between hover:shadow-md transition">
            <div>
              <h3 class="font-bold text-gray-800 text-sm">${p.nombre}</h3>
              <p class="text-xs text-gray-500">Stock: ${p.stock}</p>
            </div>
            <div class="flex justify-between items-center mt-3">
              <span class="font-bold text-blue-600">$${p.precio.toFixed(2)}</span>
              <button onclick="addToCart(${p.id})" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded text-xs">
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    function filterProducts() {
      const query = document.getElementById('pos-search-prod').value.toLowerCase();
      const filtered = productos.filter(p => p.nombre.toLowerCase().includes(query));
      renderProductos(filtered);
    }

    // --- BUSCADOR DE CLIENTES EN CARRITO ---
    function searchCliente() {
      const query = document.getElementById('search-cliente').value.toLowerCase();
      const resultsDiv = document.getElementById('cliente-results');
      
      if (!query) {
        resultsDiv.classList.add('hidden');
        return;
      }

      const filtered = clientes.filter(c => 
        c.nombre.toLowerCase().includes(query) || c.ci.includes(query)
      );

      if (filtered.length === 0) {
        resultsDiv.innerHTML = `<div class="p-2 text-gray-400">Sin resultados</div>`;
      } else {
        resultsDiv.innerHTML = filtered.map(c => `
          <div onclick="selectCliente(${c.id})" class="p-2 hover:bg-blue-50 cursor-pointer border-b last:border-b-0">
            <p class="font-semibold text-gray-800">${c.nombre}</p>
            <p class="text-xs text-gray-500">CI/RUC: ${c.ci}</p>
          </div>
        `).join('');
      }

      resultsDiv.classList.remove('hidden');
    }

    function selectCliente(id) {
      clienteSeleccionado = clientes.find(c => c.id === id);
      document.getElementById('cliente-seleccionado').innerText = `Cliente actual: ${clienteSeleccionado.nombre}`;
      document.getElementById('search-cliente').value = '';
      document.getElementById('cliente-results').classList.add('hidden');
    }

    // --- MANEJO DEL CARRITO ---
    function addToCart(id) {
      const prod = productos.find(p => p.id === id);
      const itemInCart = carrito.find(item => item.id === id);

      if (itemInCart) {
        if (itemInCart.qty < prod.stock) itemInCart.qty++;
      } else {
        carrito.push({ ...prod, qty: 1 });
      }
      renderCarrito();
    }

    function renderCarrito() {
      const container = document.getElementById('carrito-items');
      if (carrito.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">El carrito está vacío</p>`;
        document.getElementById('cart-total').innerText = '$0.00';
        return;
      }

      let total = 0;
      container.innerHTML = carrito.map(item => {
        const subtotal = item.precio * item.qty;
        total += subtotal;
        return `
          <div class="flex justify-between items-center text-sm border-b pb-2">
            <div>
              <p class="font-semibold text-gray-700">${item.nombre}</p>
              <p class="text-xs text-gray-500">$${item.precio.toFixed(2)} x ${item.qty}</p>
            </div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-gray-800">$${subtotal.toFixed(2)}</span>
              <button onclick="removeFromCart(${item.id})" class="text-red-500 hover:text-red-700 text-xs">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
    }

    function removeFromCart(id) {
      carrito = carrito.filter(i => i.id !== id);
      renderCarrito();
    }

    function togglePagoCredito() {
      const metodo = document.getElementById('metodo-pago').value;
      const boxInicial = document.getElementById('box-pago-inicial');
      if (metodo === 'credito') {
        boxInicial.classList.remove('hidden');
      } else {
        boxInicial.classList.add('hidden');
      }
    }

    // --- PROCESAR VENTA (CONTADO O CRÉDITO) ---
    function procesarVenta() {
      if (carrito.length === 0) {
        alert("Agrega productos al carrito antes de procesar.");
        return;
      }

      const total = carrito.reduce((acc, i) => acc + (i.precio * i.qty), 0);
      const metodo = document.getElementById('metodo-pago').value;

      if (metodo === 'credito') {
        if (clienteSeleccionado.id === 1) {
          alert("Para realizar una venta a crédito debes seleccionar un cliente específico.");
          return;
        }

        const abonoInicial = parseFloat(document.getElementById('pago-inicial').value) || 0;
        const saldo = total - abonoInicial;

        cuentasPorCobrar.push({
          cliente: clienteSeleccionado.nombre,
          total: total,
          saldo: saldo,
          estado: saldo <= 0 ? 'Pagado' : 'Pendiente'
        });

        alert(`Venta a crédito registrada con éxito. Saldo restante: $${saldo.toFixed(2)}`);
      } else {
        alert("Venta de contado procesada con éxito.");
      }

      // Descontar inventario
      carrito.forEach(item => {
        const prod = productos.find(p => p.id === item.id);
        if (prod) prod.stock -= item.qty;
      });

      // Resetear estado
      carrito = [];
      clienteSeleccionado = clientes[0];
      document.getElementById('cliente-seleccionado').innerText = `Cliente actual: Consumidor Final`;
      document.getElementById('pago-inicial').value = 0;
      renderProductos();
      renderCarrito();
    }

    // --- GESTIÓN DE CRÉDITOS Y ABONOS ---
    function renderCreditos() {
      const tbody = document.getElementById('tabla-creditos');
      if (cuentasPorCobrar.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">No hay cuentas a crédito registradas</td></tr>`;
        return;
      }

      tbody.innerHTML = cuentasPorCobrar.map((c, index) => `
        <tr class="hover:bg-gray-50">
          <td class="p-3 font-semibold">${c.cliente}</td>
          <td class="p-3">$${c.total.toFixed(2)}</td>
          <td class="p-3 font-bold text-red-600">$${c.saldo.toFixed(2)}</td>
          <td class="p-3">
            <span class="px-2 py-1 rounded-full text-xs font-semibold ${c.saldo <= 0 ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
              ${c.saldo <= 0 ? 'Pagado' : 'Pendiente'}
            </span>
          </td>
          <td class="p-3 text-center">
            ${c.saldo > 0 ? `
              <button onclick="openModalAbono(${index})" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-semibold">
                <i class="fa-solid fa-plus mr-1"></i> Abonar
              </button>
            ` : '<span class="text-xs text-gray-400">Completado</span>'}
          </td>
        </tr>
      `).join('');
    }

    function openModalAbono(index) {
      creditoIndexSeleccionado = index;
      const cuenta = cuentasPorCobrar[index];
      document.getElementById('abono-cliente-nombre').innerText = `Cliente: ${cuenta.cliente}`;
      document.getElementById('abono-saldo-actual').innerText = `Saldo actual: $${cuenta.saldo.toFixed(2)}`;
      document.getElementById('monto-abono').value = '';
      document.getElementById('modal-abono').classList.remove('hidden');
    }

    function closeModalAbono() {
      document.getElementById('modal-abono').classList.add('hidden');
    }

    function confirmarAbono() {
      const monto = parseFloat(document.getElementById('monto-abono').value);
      if (isNaN(monto) || monto <= 0) {
        alert("Ingresa un monto válido.");
        return;
      }

      const cuenta = cuentasPorCobrar[creditoIndexSeleccionado];
      if (monto > cuenta.saldo) {
        alert("El abono no puede ser mayor al saldo pendiente.");
        return;
      }

      cuenta.saldo -= monto;
      if (cuenta.saldo <= 0) cuenta.estado = 'Pagado';

      closeModalAbono();
      renderCreditos();
    }

    // Inicializar app
    renderProductos();
  </script>
</body>
</html>
