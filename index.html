<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️super MIX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 class="mb-4"><i class="bi bi-cart-check"></i> Módulo de Compras y Abonos a Crédito</h2>

    <!-- Formulario Nueva Compra -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0">Registrar Nueva Compra</h5>
        </div>
        <div class="card-body">
            <form id="formCompra" onsubmit="guardarCompra(event)">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Proveedor</label>
                        <input type="text" id="compraProveedor" class="form-control" required placeholder="Nombre del proveedor">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Monto Total ($)</label>
                        <input type="number" id="compraTotal" class="form-control" step="0.01" min="1" required placeholder="0.00">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Condición de Pago</label>
                        <select id="compraCondicionPago" class="form-select" onchange="toggleCreditoCompra(this.value)">
                            <option value="CONTADO">Contado</option>
                            <option value="CREDITO">Crédito</option>
                        </select>
                    </div>
                    <div class="col-md-4 id-credito-group" style="display: none;">
                        <label class="form-label">Abono Inicial ($)</label>
                        <input type="number" id="compraAbonoInicial" class="form-control" value="0" min="0" step="0.01">
                    </div>
                    <div class="col-md-8 id-credito-group" style="display: none;">
                        <label class="form-label">Nota / Referencia de Pago</label>
                        <input type="text" id="compraNotaInicial" class="form-control" placeholder="Ej: Pago inicial en efectivo">
                    </div>
                </div>
                <button type="submit" class="btn btn-success mt-3"><i class="bi bi-save"></i> Guardar Compra</button>
            </form>
        </div>
    </div>

    <!-- Tabla Cuentas por Pagar (Compras a Crédito) -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="card-title mb-0">Cuentas por Pagar (Compras a Crédito)</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha</th>
                            <th>Proveedor</th>
                            <th>Total Compra</th>
                            <th>Saldo Pendiente</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaComprasCredito">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Registrar Abono -->
<div class="modal fade" id="modalAbonoCompra" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Registrar Abono a Proveedor</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formAbonoCompra" onsubmit="guardarAbonoCompra(event)">
                    <input type="hidden" id="abonoCompraId">
                    <div class="mb-3">
                        <label class="form-label">Saldo Actual Pendiente</label>
                        <input type="text" id="abonoSaldoPendiente" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Monto del Abono ($)</label>
                        <input type="number" id="abonoMonto" class="form-control" step="0.01" min="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Método de Pago</label>
                        <select id="abonoMetodoPago" class="form-select" required>
                            <option value="Efectivo">Efectivo</option>
                            <option value="Transferencia">Transferencia</option>
                            <option value="Banco">Banco / Tarjeta</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nota / Referencia</label>
                        <input type="text" id="abonoNota" class="form-control" placeholder="Ej: Comprobante #1234">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar Abono</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal Historial de Abonos -->
<div class="modal fade" id="modalHistorialAbonos" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">Historial de Abonos</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Monto</th>
                            <th>Método</th>
                            <th>Nota</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorialBody">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Inicialización de la Base de Datos
    let DB = JSON.parse(localStorage.getItem('DB_COMPRAS')) || { compras: [] };

    function guardarDB() {
        localStorage.setItem('DB_COMPRAS', JSON.stringify(DB));
        renderTablaComprasCredito();
    }

    function toggleCreditoCompra(tipo) {
        const groups = document.querySelectorAll('.id-credito-group');
        groups.forEach(g => g.style.display = (tipo === 'CREDITO') ? 'block' : 'none');
    }

    function guardarCompra(e) {
        e.preventDefault();
        const proveedor = document.getElementById('compraProveedor').value;
        const total = parseFloat(document.getElementById('compraTotal').value);
        const condicionPago = document.getElementById('compraCondicionPago').value;
        const abonoInicial = parseFloat(document.getElementById('compraAbonoInicial').value) || 0;
        const notaInicial = document.getElementById('compraNotaInicial').value;

        const nuevaCompra = {
            id: Date.now(),
            fecha: new Date().toISOString().split('T')[0],
            proveedor,
            total,
            condicionPago,
            saldoPendiente: condicionPago === 'CREDITO' ? Math.max(0, total - abonoInicial) : 0,
            estadoPago: condicionPago === 'CONTADO' ? 'PAGADO' : (abonoInicial >= total ? 'PAGADO' : 'PENDIENTE'),
            abonos: []
        };

        if (condicionPago === 'CREDITO' && abonoInicial > 0) {
            nuevaCompra.abonos.push({
                id: Date.now() + 1,
                fecha: nuevaCompra.fecha,
                monto: Math.min(abonoInicial, total),
                metodoPago: 'Efectivo',
                nota: notaInicial || 'Abono Inicial'
            });
            if (nuevaCompra.saldoPendiente > 0) nuevaCompra.estadoPago = 'PARCIAL';
        }

        DB.compras.push(nuevaCompra);
        guardarDB();

        document.getElementById('formCompra').reset();
        toggleCreditoCompra('CONTADO');
    }

    function renderTablaComprasCredito() {
        const contenedor = document.getElementById('tablaComprasCredito');
        if (!contenedor) return;

        const comprasCredito = DB.compras.filter(c => c.condicionPago === 'CREDITO');

        if (comprasCredito.length === 0) {
            contenedor.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-3">No hay compras a crédito registradas.</td></tr>`;
            return;
        }

        contenedor.innerHTML = comprasCredito.map(c => `
            <tr>
                <td>${c.fecha}</td>
                <td>${c.proveedor}</td>
                <td>$${c.total.toLocaleString()}</td>
                <td>$${(c.saldoPendiente || 0).toLocaleString()}</td>
                <td>
                    <span class="badge ${c.estadoPago === 'PAGADO' ? 'bg-success' : c.estadoPago === 'PARCIAL' ? 'bg-warning text-dark' : 'bg-danger'}">
                        ${c.estadoPago}
                    </span>
                </td>
                <td>
                    ${c.saldoPendiente > 0 ? `
                        <button class="btn btn-sm btn-outline-primary" onclick="abrirModalAbono(${c.id}, ${c.saldoPendiente})">
                            + Abono
                        </button>
                    ` : '<span class="text-success"><i class="bi bi-check-circle-fill"></i> Paz y Salvo</span>'}
                    <button class="btn btn-sm btn-outline-info" onclick="verHistorialAbonos(${c.id})">
                        Historial
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function abrirModalAbono(id, saldo) {
        document.getElementById('abonoCompraId').value = id;
        document.getElementById('abonoSaldoPendiente').value = `$${saldo.toLocaleString()}`;
        document.getElementById('abonoMonto').value = '';
        document.getElementById('abonoMonto').max = saldo;
        const modal = new bootstrap.Modal(document.getElementById('modalAbonoCompra'));
        modal.show();
    }

    function guardarAbonoCompra(e) {
        e.preventDefault();
        const id = parseInt(document.getElementById('abonoCompraId').value);
        const monto = parseFloat(document.getElementById('abonoMonto').value);
        const metodoPago = document.getElementById('abonoMetodoPago').value;
        const nota = document.getElementById('abonoNota').value;

        const compra = DB.compras.find(c => c.id === id);
        if (!compra) return;

        if (monto > compra.saldoPendiente) {
            alert('El abono no puede superar el saldo pendiente.');
            return;
        }

        compra.abonos.push({
            id: Date.now(),
            fecha: new Date().toISOString().split('T')[0],
            monto,
            metodoPago,
            nota
        });

        const totalAbonado = compra.abonos.reduce((sum, a) => sum + a.monto, 0);
        compra.saldoPendiente = compra.total - totalAbonado;

        if (compra.saldoPendiente <= 0) {
            compra.saldoPendiente = 0;
            compra.estadoPago = 'PAGADO';
        } else {
            compra.estadoPago = 'PARCIAL';
        }

        guardarDB();

        const modalElement = document.getElementById('modalAbonoCompra');
        const modal = bootstrap.Modal.getInstance(modalElement);
        modal.hide();
    }

    function verHistorialAbonos(id) {
        const compra = DB.compras.find(c => c.id === id);
        if (!compra) return;

        const tbody = document.getElementById('tablaHistorialBody');
        if (!compra.abonos || compra.abonos.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Sin abonos registrados.</td></tr>`;
        } else {
            tbody.innerHTML = compra.abonos.map(a => `
                <tr>
                    <td>${a.fecha}</td>
                    <td>$${a.monto.toLocaleString()}</td>
                    <td>${a.metodoPago}</td>
                    <td>${a.nota || '-'}</td>
                </tr>
            `).join('');
        }

        const modal = new bootstrap.Modal(document.getElementById('modalHistorialAbonos'));
        modal.show();
    }

    // Carga inicial
    document.addEventListener('DOMContentLoaded', renderTablaComprasCredito);
</script>
</body>
</html>
